<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Book an order — TATIA.brand</title>
<meta name="description" content="Book a made-to-measure order with TATIA.brand.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="nav"><div class="wrap"><a class="logo" href="index.html">TATIA<span>.</span>brand</a><nav><a href="index.html#story">Story</a><a href="index.html#work">Work</a><a href="https://www.instagram.com/tatia.brand" target="_blank" rel="noopener">Instagram</a><a href="order.html">Book an order</a></nav></div></header>
<main><section><div class="wrap">
<div class="kicker">Order booking</div>
<h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">Tell us about your piece</h1>
<p class="note" style="max-width:560px;margin-bottom:34px">No payment is taken here. Send your booking and TATIA.brand will get back to you about design, fitting and price.</p>
<form id="f" novalidate>
<div class="row"><label>Your name<input name="name" required maxlength="100" autocomplete="name"></label>
<label>Email<input name="email" type="email" required maxlength="200" autocomplete="email"></label></div>
<div class="row"><label>Mobile (optional)<input name="phone" maxlength="40" autocomplete="tel"></label>
<label>City and country (we ship worldwide)<input name="place" required maxlength="120" autocomplete="address-level2"></label></div>
<div class="row"><label>What would you like?<select name="kind"><option>Custom couture design</option><option>Racewear</option><option>Casual garment</option><option>Collaboration</option><option>Something else</option></select></label>
<label>Date you need it by<input name="needby" type="date"></label></div>
<label>Tell us your idea<textarea name="idea" rows="6" required maxlength="3000" placeholder="Occasion, colours, style, anything you have in mind"></textarea></label>
<div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
<label class="check"><input type="checkbox" name="ok" required> I agree that my details are used only to answer this order booking.</label>
<div><button class="btn" id="go" type="submit">Send order booking</button></div>
<div id="msg" role="status"></div>
</form>
</div></section></main>
<footer><div class="wrap"><p><strong>TATIA.brand</strong> · Bespoke fashion · Darwin, Northern Territory, Australia</p><p><a href="https://www.instagram.com/tatia.brand" rel="noopener" target="_blank">Instagram @tatia.brand</a></p></div></footer>
<script src="config.js"></script><script src="order.js"></script>
</body></html>
